<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roller Dice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Roller Dice</h1>
    <h2>Choose how many dice you would like to roll.</h2>
    <label for="diceInput"></label>
    <input type="text" id="diceInput" min="1" max="10" value="1">

    <button onclick="rollDice()">Roll Dices</button>
    <div id="diceResults"></div>
    <div id="diceImages"></div>
    <script src="index.js"></script>
</body>
</html>
